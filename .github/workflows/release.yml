name: Release package

# Builds ollama-cuda-git and publishes it to the GitHub release page.
#
# The package compiles llama.cpp's CUDA backend against the side-by-side CUDA
# 11.8 toolkit, which is not in the official Arch repositories. This workflow
# therefore builds and installs the sibling cuda11.8 package first, exactly as
# a user would have to.
#
# Constraints that shape this workflow:
#
#   * GitHub caps a release asset at 2 GiB (2 147 483 648 bytes). The ollama
#     package is well under that, but the same split logic is kept so the
#     workflow does not silently start failing if the package grows.
#   * The CUDA toolkit alone needs ~30 GB of scratch, so unused toolchains are
#     removed from the runner first.
#
# Triggered by pushing a tag like v0.34.1-1, or manually via workflow_dispatch.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.34.1-1)"
        required: true

permissions:
  contents: write

env:
  PKG_NAME: ollama-cuda-git
  # The sibling repository that provides CUDA 11.8.
  CUDA11_8_REPO: "https://github.com/fufurobot/cuda11.8.git"

jobs:
  build-and-release:
    name: Build and publish ollama-cuda-git
    runs-on: ubuntu-latest
    timeout-minutes: 720

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # llama.cpp's CUDA build peaks well above the default free space on
          # these images, and the CUDA toolkit is installed alongside it.
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/lib/android \
                      /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/lib/node_modules /opt/az /usr/lib/mono || true
          sudo apt-get clean
          docker image prune -af || true
          echo "after:"; df -h / | tail -1

      - name: Verify enough space remains
        run: |
          avail=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "available: ${avail}G"
          if (( avail < 35 )); then
            echo "::error::only ${avail}G free; the CUDA build needs about 35G"
            exit 1
          fi

      - name: Resolve the release tag
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "publishing: ${tag}"

      - name: Build the package in an Arch Linux container
        run: |
          # Everything runs inside archlinux so glibc, gcc-10, go and pacman
          # match the target distribution. The workspace is bind-mounted so the
          # finished package lands where the release steps can see it.
          #
          # makepkg refuses to run as root, so the container creates an
          # unprivileged builder. makepkg itself is used for the CUDA toolkit so
          # the dependency is satisfied the same way a user would satisfy it.
          # $GITHUB_WORKSPACE rather than $PWD: the mount needs a host-absolute
          # path, and an empty or relative value makes Docker silently create
          # an empty /work instead of bind-mounting, which then fails with
          # "cd: /work: No such file or directory".
          work="$GITHUB_WORKSPACE"
          echo "workspace: ${work}"
          test -d "$work" || { echo "::error::workspace ${work} does not exist"; exit 1; }

          mkdir -p "$work/.makepkg/ollama/pkg" "$work/.makepkg/ollama/build" \
                   "$work/.makepkg/ollama/src" "$work/.makepkg/cuda/pkg" \
                   "$work/.makepkg/cuda/build" "$work/.makepkg/cuda/src"

          docker run --rm \
            -v "${work}:/work" \
            -w /work \
            -e MAKEPKG_DIR=/work/.makepkg \
            -e CUDA11_8_REPO="$CUDA11_8_REPO" \
            archlinux:base-devel \
            bash -euo pipefail -c '
              echo "== refreshing the keyring =="
              pacman-key --init >/dev/null 2>&1 || true
              pacman-key --populate archlinux >/dev/null 2>&1 || true
              pacman -Sy --noconfirm --needed --noprogressbar archlinux-keyring >/dev/null
              pacman -S --noconfirm --needed --noprogressbar base-devel sudo git patch >/dev/null

              useradd -m -s /bin/bash builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
              chmod 0440 /etc/sudoers.d/builder
              chown -R builder:builder /work

              # --- 1. Build and install the CUDA 11.8 toolkit ---------------
              echo "== building the cuda11.8 toolkit =="
              git clone --depth 1 "$CUDA11_8_REPO" /tmp/cuda11.8
              cd /tmp/cuda11.8
              chown -R builder:builder /tmp/cuda11.8
              sudo -u builder -H bash -euo pipefail -c "
                export BUILDDIR=/work/.makepkg/cuda/build
                export SRCDEST=/work/.makepkg/cuda/src
                export PKGDEST=/work/.makepkg/cuda/pkg
                makepkg --noconfirm --force
              "
              pacman -U --noconfirm --needed --noprogressbar --overwrite "*" \
                /work/.makepkg/cuda/pkg/*.pkg.tar.zst

              cudaroot=$(grep -m1 "^_cudaroot=" /tmp/cuda11.8/PKGBUILD | cut -d= -f2)
              echo "CUDA installed at: ${cudaroot}"
              "${cudaroot}/bin/nvcc" --version | grep -i release

              # --- 2. Verify the backend list against this toolkit ----------
              # Proves the preset only advertises architectures this nvcc can
              # compile, which is exactly what fails later if it is wrong.
              echo "== probing the cuda_v11 architecture list =="
              pacman -S --noconfirm --needed --noprogressbar python >/dev/null
              cd /work
              python3 tools/verify_backend_consistency.py --cuda-root "${cudaroot}"

              # --- 3. Build ollama -----------------------------------------
              echo "== building ollama-cuda-git =="
              sudo -u builder -H bash -euo pipefail -c "
                cd /work
                export BUILDDIR=/work/.makepkg/ollama/build
                export SRCDEST=/work/.makepkg/ollama/src
                export PKGDEST=/work/.makepkg/ollama/pkg
                makepkg --noconfirm --force
              "
              echo "== produced =="
              ls -la /work/.makepkg/ollama/pkg
            '

      - name: Verify the built package
        id: verify
        run: |
          shopt -s nullglob
          pkgs=(.makepkg/ollama/pkg/*.pkg.tar.zst)
          if (( ${#pkgs[@]} == 0 )); then
            echo "::error::no package was produced"
            exit 1
          fi
          for pkg in "${pkgs[@]}"; do
            echo "checking $(basename "$pkg")"
            # A truncated archive is the classic failure; prove it is readable.
            bsdtar -tf "$pkg" >/dev/null
            echo "  archive OK ($(bsdtar -tf "$pkg" | wc -l) entries)"

            # The binary and the CUDA runners are what make this package useful.
            bsdtar -tf "$pkg" | grep -qx './usr/bin/ollama' \
              || { echo "::error::missing usr/bin/ollama"; exit 1; }
            echo "  contains usr/bin/ollama"

            runners=$(bsdtar -tf "$pkg" | grep -c 'lib/ollama/cuda_v11/' || true)
            echo "  cuda_v11 runner files: ${runners}"
            if (( runners == 0 )); then
              echo "::error::the package contains no cuda_v11 CUDA runners"
              exit 1
            fi
          done
          echo "package=${pkgs[0]}" >> "$GITHUB_OUTPUT"

      - name: Split into sub-2GiB parts
        run: |
          pkg="${{ steps.verify.outputs.package }}"
          base=$(basename "$pkg")
          size=$(stat -c%s "$pkg")
          limit=$((2 * 1024 * 1024 * 1024 - 1024 * 1024))   # 2 GiB less 1 MiB

          echo "package: ${base} (${size} bytes)"
          echo "asset limit: ${limit} bytes"

          mkdir -p release-assets
          if (( size < limit )); then
            echo "fits in one asset; publishing as-is"
            cp "$pkg" "release-assets/${base}"
          else
            parts=$(( (size + limit - 1) / limit ))
            echo "splitting into ${parts} parts"
            split -b "$limit" -d --suffix-length=2 "$pkg" "release-assets/${base}.part-"
          fi

          # Checksums must cover BOTH the files actually published and the
          # name the user ends up with after reassembling, otherwise the
          # documented `sha256sum -c SHA256SUMS.txt` fails on the joined file.
          (
            cd release-assets
            : > SHA256SUMS.txt
            if ls ./*.part-* >/dev/null 2>&1; then
              # Whole-package digest, recorded under the reassembled name.
              digest=$(sha256sum "$GITHUB_WORKSPACE/$pkg" | cut -d" " -f1)
              printf "%s  %s\n" "$digest" "$base" >> SHA256SUMS.txt
              # Per-part digests, so a bad download is caught before joining.
              sha256sum ./*.part-* >> SHA256SUMS.txt
            else
              sha256sum "$base" >> SHA256SUMS.txt
            fi
            cat SHA256SUMS.txt
          )

          echo "=== upload set ==="
          ls -la release-assets/

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.release.outputs.tag }}"
          pkg="${{ steps.verify.outputs.package }}"
          base=$(basename "$pkg")

          split_note=""
          if ls release-assets/*.part-* >/dev/null 2>&1; then
            split_note=$(cat <<EOF

          ### This package is published in parts

          GitHub limits a release asset to 2 GiB and this package is larger, so
          it is split. Reassemble it before installing:

          \`\`\`sh
          cat ${base}.part-* > ${base}
          sha256sum -c SHA256SUMS.txt
          sudo pacman -U ${base}
          \`\`\`
          EOF
          )
          fi

          # Idempotent: re-running a tag updates the existing release.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release ${tag} exists; uploading/replacing assets"
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* \
              --title "ollama-cuda-git ${tag}" \
              --notes "$(cat <<EOF
          Arch Linux package for Ollama with CUDA support, built from the
          PKGBUILD in this repository on an Arch Linux container.

          Built against CUDA 11.8 (\`/opt/cuda-11.8\`), so it does not replace or
          depend on the distribution's \`cuda\` package.

          ### Requirements

          * an NVIDIA GPU and a driver new enough for the bundled runtime
          * the \`cuda11.8\` package, published in
            [fufurobot/cuda11.8](https://github.com/fufurobot/cuda11.8/releases),
            must be installed first

          Install with \`sudo pacman -U <package>\`, then enable the service:

          \`\`\`sh
          sudo systemctl enable --now ollama
          ollama run llama3
          \`\`\`
          ${split_note}
          EOF
          )"
          fi

          echo "=== release contents ==="
          gh release view "$tag" --json assets --jq '.assets[] | "\(.name) \(.size)"'
